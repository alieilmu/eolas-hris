# ---------------------------------------------------------------------------
# Eolas HRIS — instalasi klien (on-premise). Dipasang oleh install.sh di /opt/eolas.
# Nilai rahasia ada di .env (dibuat installer). Data: volume eolas_db-data (MySQL),
# eolas_app-storage (lampiran, logo, lisensi), eolas_caddy-data (sertifikat HTTPS).
# ---------------------------------------------------------------------------
name: eolas

x-app: &app
  image: eolas-hris:${EOLAS_VERSION}
  restart: unless-stopped
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: 3306
    EOLAS_EDITION: client
  volumes:
    - app-storage:/var/www/html/storage
  networks: [internal]

services:
  app:
    <<: *app
    container_name: eolas-app
    depends_on:
      db:
        condition: service_healthy

  queue:
    <<: *app
    container_name: eolas-queue
    environment:
      DB_HOST: db
      DB_PORT: 3306
      EOLAS_EDITION: client
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    user: www-data
    entrypoint: []
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: eolas-scheduler
    environment:
      DB_HOST: db
      DB_PORT: 3306
      EOLAS_EDITION: client
      RUN_MIGRATIONS: "false"
    command: php artisan schedule:work
    user: www-data
    entrypoint: []
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: eolas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]

  # HTTPS di depan aplikasi: Let's Encrypt (domain publik), sertifikat internal (jaringan kantor) atau sertifikat perusahaan.
  caddy:
    image: caddy:2.8.4-alpine
    container_name: eolas-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

volumes:
  db-data:
  app-storage:
  caddy-data:
  caddy-config:

networks:
  internal:
