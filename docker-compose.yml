# ---------------------------------------------------------------------------
# HRIS Eolas — duplikasi dari HR Puspita (hcpuspita), lingkungan terpisah.
#
# Domain: https://hris.eolas.id (old eolas./eloas.zamaludinilmu.com redirect there, except /iclock) (lewat Traefik, container n8n-traefik-1).
# Image, container, volume & database berdiri sendiri. Akses lokal: 127.0.0.1:8097.
# Data MySQL ada di volume `hris_eloas_db-data`, upload di `hris_eloas_app-storage`.
# ---------------------------------------------------------------------------
name: hris_eloas

services:
  app:
    build: .
    image: hris_eloas-app:latest
    container_name: hris_eloas-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "127.0.0.1:8097:80"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, n8n_default]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.hris_eloas.rule=Host(`eloas.zamaludinilmu.com`)
      - traefik.http.routers.hris_eloas.entrypoints=websecure
      - traefik.http.routers.hris_eloas.tls=true
      - traefik.http.routers.hris_eloas.tls.certresolver=mytlschallenge
      - traefik.http.routers.hris_eloas.service=hris_eloas
      # The old domains move permanently to hris.eolas.id.
      - traefik.http.middlewares.eolas-redirect.redirectregex.regex=^https?://e(?:o|l)(?:l|o)as\.zamaludinilmu\.com/(.*)
      - traefik.http.middlewares.eolas-redirect.redirectregex.replacement=https://hris.eolas.id/$${1}
      - traefik.http.middlewares.eolas-redirect.redirectregex.permanent=true
      - traefik.http.routers.hris_eloas.middlewares=eolas-redirect
      - traefik.http.services.hris_eloas.loadbalancer.server.port=80
      # Eolas: the product's own domain (own router and certificate).
      - traefik.http.routers.hris_eolas.rule=Host(`eolas.zamaludinilmu.com`)
      - traefik.http.routers.hris_eolas.entrypoints=websecure
      - traefik.http.routers.hris_eolas.tls=true
      - traefik.http.routers.hris_eolas.tls.certresolver=mytlschallenge
      - traefik.http.routers.hris_eolas.service=hris_eloas
      - traefik.http.routers.hris_eolas.middlewares=eolas-redirect
      # Attendance machines already set to the old domains keep pushing to /iclock without a redirect.
      - traefik.http.routers.hris_iclock_old.rule=(Host(`eolas.zamaludinilmu.com`) || Host(`eloas.zamaludinilmu.com`)) && PathPrefix(`/iclock`)
      - traefik.http.routers.hris_iclock_old.entrypoints=websecure
      - traefik.http.routers.hris_iclock_old.tls=true
      - traefik.http.routers.hris_iclock_old.tls.certresolver=mytlschallenge
      - traefik.http.routers.hris_iclock_old.priority=200
      - traefik.http.routers.hris_iclock_old.service=hris_eloas
      # hris.eolas.id: the product domain (own router and certificate).
      - traefik.http.routers.hris_eolasid.rule=Host(`hris.eolas.id`)
      - traefik.http.routers.hris_eolasid.entrypoints=websecure
      - traefik.http.routers.hris_eolasid.tls=true
      - traefik.http.routers.hris_eolasid.tls.certresolver=mytlschallenge
      - traefik.http.routers.hris_eolasid.service=hris_eloas

  queue:
    image: hris_eloas-app:latest
    container_name: hris_eloas-queue
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    user: www-data
    entrypoint: []
    healthcheck:
      disable: true
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

  # Laravel scheduler: eolas:prune-workspaces every hour (routes/console.php).
  scheduler:
    image: hris_eloas-app:latest
    container_name: hris_eloas-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
    command: php artisan schedule:work
    user: www-data
    entrypoint: []
    healthcheck:
      disable: true
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

  db:
    image: mysql:8.4
    container_name: hris_eloas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

volumes:
  db-data:
  app-storage:

networks:
  internal:
  n8n_default:
    external: true
